<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banker’s Algorithm Lab</title><style>
:root{--ink:#18304d;--blue:#245bb2;--pale:#eef4fc;--green:#147554;--red:#b82e49;--gold:#996410}*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,sans-serif;color:var(--ink);background:#f2f6fb}header{background:#142f53;color:white;padding:28px max(22px,calc((100vw - 1200px)/2))}header p{color:#c9dcf5;margin:4px 0}h1{margin:4px 0;font-size:34px}h2{font-size:24px;margin:0 0 10px}h3{font-size:19px;margin:18px 0 8px}main{max-width:1244px;margin:auto;padding:22px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}button,select,input{font:inherit;border:1px solid #b6c6dd;border-radius:8px;padding:9px 13px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#e6efff}button.active,button.primary{background:var(--blue);color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d18e22;outline-offset:3px}input[type=number]{width:82px}label{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px}.card{background:white;border:1px solid #dbe5f2;border-radius:14px;padding:22px;box-shadow:0 4px 20px #173a5d05}.muted{color:#526780}.small{font-size:14px}.status{border-left:4px solid var(--blue);padding:15px;background:#eaf1ff;border-radius:5px;min-height:100px}.status.safe{border-color:var(--green);background:#eef9f4}.status.unsafe{border-color:var(--red);background:#fff0f3}.numbers{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-size:20px;font-weight:650}.pool{padding:13px;background:#f3f6fb;border-radius:9px;margin-bottom:10px}.tokens{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;min-height:24px}.token{width:20px;height:20px;border-radius:50%;background:var(--blue);animation:move .4s ease-out}.token.t1{background:#8752b4}.token.t2{background:#168374}.empty{color:#687c95;font-size:14px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{padding:13px 11px;border-bottom:1px solid #dce5f1;text-align:center;white-space:nowrap}th{background:#edf3fc;font-size:14px}td{font-size:20px;font-variant-numeric:tabular-nums}td:first-child{text-align:left;font-weight:650}td:last-child{font-size:14px}tr.selected{background:#fff2d6}tr.done{background:#eef9f4;color:var(--green)}.seq{min-height:50px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chip{padding:6px 13px;background:#dfeee8;border-radius:30px;color:#12583e;font-weight:650}.formula{background:#f2f5fa;border-radius:6px;padding:10px;font-family:ui-monospace,monospace;font-size:15px}.request{border-top:1px solid #dce5f1;padding-top:15px;margin-top:16px}.phase{display:inline-block;padding:4px 10px;background:#edf3fc;border-radius:30px;font-size:14px;margin-bottom:12px}.compare{line-height:1.8}.compare .yes{color:var(--green)}.compare .no{color:var(--red)}details{margin-top:16px}summary{cursor:pointer;font-weight:650}li{margin:7px 0}.log{max-height:185px;overflow:auto;padding-left:23px;font-size:14px}footer{margin:22px 0;font-size:14px;color:#526780}.note{padding:12px 0;border-top:1px solid #e1e7f0}#toast{min-height:26px;font-size:15px}.check{font-size:15px} @keyframes move{from{transform:translateY(-9px);opacity:.25}to{transform:none;opacity:1}}@media(max-width:900px){.layout{grid-template-columns:1fr}main{padding:14px}.card{padding:16px}h1{font-size:29px}td{font-size:18px}th,td{padding:10px 8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><header><p>OPERATING SYSTEMS · PREDICT, TEST, EXPLAIN</p><h1>Banker’s Algorithm</h1><p>Dr. Xiaoyuan Suo, Webster University</p></header><main><div class="bar"><label>Example <select id="scenario"><option value="twenty">20 units · four processes</option><option value="slide">10 units · lecture slide connection</option><option value="multi">Three resource types · five processes</option></select></label><button id="reset">Reset example</button></div><nav class="bar" aria-label="Activities"><button id="safetyTab" class="active">1. Find a safe sequence</button><button id="requestTab">2. Test a new request</button></nav><div id="app"></div><footer>Open this HTML file in any modern browser, or host it with GitHub Pages. All activities run offline.</footer></main><script>
'use strict';
const examples={twenty:{title:'20 identical resource units',labels:['Units'],total:[20],names:['A','B','C','D'],alloc:[[3],[2],[4],[5]],max:[[10],[8],[9],[12]],presets:[{name:'A requests 2',i:0,q:[2]},{name:'B requests 2',i:1,q:[2]}]},slide:{title:'Connect to the lecture slide',labels:['Units'],total:[10],names:['A','B','C','D'],alloc:[[1],[1],[2],[4]],max:[[6],[5],[4],[7]],presets:[{name:'B requests 1',i:1,q:[1]},{name:'C requests 1',i:2,q:[1]}]},multi:{title:'Five processes and three resource types',labels:['R1','R2','R3'],total:[12,10,9],names:['A','B','C','D','E'],alloc:[[2,1,1],[3,1,1],[1,2,2],[2,2,1],[1,1,1]],max:[[6,3,2],[5,3,3],[4,5,4],[6,3,4],[3,5,3]],presets:[{name:'A requests [2, 0, 0]',i:0,q:[2,0,0]},{name:'B requests [1, 1, 0]',i:1,q:[1,1,0]}]}};
const $=s=>document.querySelector(s),copy=x=>structuredClone(x),vec=a=>a.length===1?String(a[0]):'['+a.join(', ')+']',add=(a,b)=>a.map((v,j)=>v+b[j]),sub=(a,b)=>a.map((v,j)=>v-b[j]),fits=(a,b)=>a.every((v,j)=>v<=b[j]);let ex,key='twenty',mode='safety',s,history=[];
function available(c){return ex.total.map((v,j)=>v-c.reduce((sum,row)=>sum+row[j],0))}function need(i){return sub(ex.max[i],s.sim[i])}function ready(i){return !s.done[i]&&fits(need(i),s.work)}
function reset(){ex=copy(examples[key]);history=[];s={real:copy(ex.alloc),sim:copy(ex.alloc),work:available(ex.alloc),done:ex.names.map(()=>false),sequence:[],phase:mode==='safety'?'choose':'request',selected:-1,request:null,trial:null,outcome:null,message:mode==='safety'?'Predict which processes can finish first. Check a process, or choose Next step to scan for one.':'Choose a process and request amount. Predict whether granting it would preserve a safe sequence.',log:[]};render()}
function save(){history.push(copy(s))}function message(t){s.message=t;s.log.push(t)}
function choose(i){save();if(!ready(i)){message(ex.names[i]+' cannot finish NEXT: remaining need '+vec(need(i))+' exceeds Work '+vec(s.work)+'. Try another unfinished process. This single failed choice does not prove the state unsafe.');s.selected=i;render();return}s.selected=i;s.phase='grant';message(ex.names[i]+' can finish: Need '+vec(need(i))+' ≤ Work '+vec(s.work)+' in every resource type. Next, simulate granting its remaining need.');render()}
function next(){if(s.phase==='request'||s.phase==='end')return;if(s.phase==='choose'){const i=ex.names.findIndex((_,i)=>ready(i));if(i>=0){choose(i);return}save();const all=s.done.every(Boolean);s.outcome=all?'safe':'unsafe';s.phase=s.request?'decision':'end';message(all?'SAFE: the full sequence '+s.sequence.join(' → ')+' shows that every process can finish under its maximum claim.': 'UNSAFE: no remaining Need fits Work '+vec(s.work)+'. A complete scan found no possible next completion. This does not by itself establish existing deadlock.');render();return}save();const i=s.selected;if(s.phase==='grant'){const n=need(i);s.work=sub(s.work,n);s.sim[i]=add(s.sim[i],n);s.phase='release';message('Simulated grant to '+ex.names[i]+': '+vec(n)+' leaves Work '+vec(s.work)+'. It now holds its maximum '+vec(ex.max[i])+'. Next, complete it and return ALL held resources.')}else if(s.phase==='release'){const returned=copy(s.sim[i]);s.work=add(s.work,returned);s.sim[i]=s.sim[i].map(()=>0);s.done[i]=true;s.sequence.push(ex.names[i]);s.phase='choose';s.selected=-1;message(ex.names[i]+' completes in the simulation and returns '+vec(returned)+'. Work is now '+vec(s.work)+'. Scan again.')}else if(s.phase==='decision'){if(s.outcome==='safe'){s.real=copy(s.trial);message('GRANT the request. Keep the tentative allocation as the new real allocation. The simulated completions were only a safety test; no real process has finished.')}else{message('DEFER the request. Undo the tentative grant and restore the original real allocation. The requester must wait.')}s.sim=copy(s.real);s.work=available(s.real);s.done=ex.names.map(()=>false);s.selected=-1;s.phase='end'}render()}
function testRequest(i,q){if(!['request','end'].includes(s.phase))return;if(q.length!==ex.labels.length||q.some(v=>!Number.isSafeInteger(v)||v<0)||q.every(v=>v===0)){$('#toast').textContent='Enter nonnegative whole numbers and request at least one unit.';return}save();const n=sub(ex.max[i],s.real[i]),a=available(s.real);s.request={i,q};s.trial=null;s.sequence=[];s.done=ex.names.map(()=>false);s.selected=i;s.outcome=null;if(!fits(q,n)){s.phase='request';message('INVALID claim: request '+vec(q)+' exceeds '+ex.names[i]+'’s remaining maximum Need '+vec(n)+'. The allocation is unchanged.');render();return}if(!fits(q,a)){s.phase='request';message('WAIT for availability: request '+vec(q)+' fits the remaining claim, but exceeds Available '+vec(a)+'. No tentative allocation is made.');render();return}s.trial=copy(s.real);s.trial[i]=add(s.trial[i],q);s.sim=copy(s.trial);s.work=sub(a,q);s.phase='choose';message('Tentatively grant '+vec(q)+' to '+ex.names[i]+'. Available changes from '+vec(a)+' to '+vec(s.work)+'. Now test for a FULL safe sequence before deciding whether to keep this grant.');render()}
function pool(){return s.work.map((v,j)=>`<div class="pool"><div class="bar" style="margin-bottom:0"><strong>${ex.labels[j]}</strong><span class="numbers">${v}</span><span class="small muted">free in ${mode!=='safety'&&['request','end'].includes(s.phase)?'displayed allocation':'safety simulation'}</span></div><div class="tokens" aria-hidden="true">${v?Array.from({length:v},()=>`<span class="token t${j}"></span>`).join(''):'<span class="empty">No free units</span>'}</div></div>`).join('')}
function render(){const running=mode==='safety'||!['request','end'].includes(s.phase),labels={request:'Choose a request',choose:'Safety simulation: select a process',grant:'Safety simulation: grant remaining need',release:'Safety simulation: return resources',decision:'Safety result: apply the decision',end:'Result'};$('#app').innerHTML=`<h2>${ex.title}</h2><p class="muted">Total resources <strong>${vec(ex.total)}</strong> · Vector order ${ex.labels.join(', ')}. Need = Maximum − Currently held.</p><div class="layout"><section class="card"><span class="phase">${labels[s.phase]}</span><h3 style="margin-top:0">${running?'Working copy for the safety test':'Resource allocation'}</h3><div class="scroll"><table><thead><tr><th>Process</th><th>Has</th><th>Max</th><th>Need</th><th>Action / status</th></tr></thead><tbody>${ex.names.map((n,i)=>`<tr class="${s.done[i]?'done':s.selected===i?'selected':''}"><td>${n}</td><td>${vec(s.sim[i])}</td><td>${vec(ex.max[i])}</td><td>${s.done[i]?'—':vec(need(i))}</td><td>${s.done[i]?'✓ Simulated finish':s.phase==='choose'?`<button data-check="${i}" class="check">Check ${n}</button>`:s.selected===i&&running?'Selected':'—'}</td></tr>`).join('')}</tbody></table></div><h3>${running?'Work pool':'Available pool'}</h3>${pool()}<div class="formula">${ex.labels.map((label,j)=>`${label}: ${ex.total[j]} total = ${s.sim.reduce((v,row)=>v+row[j],0)} held + ${s.work[j]} free`).join('<br>')}</div><h3>Simulated completion sequence</h3><div class="seq">${s.sequence.length?s.sequence.map(n=>`<span class="chip">${n}</span>`).join('<span aria-hidden="true">→</span>'):'<span class="muted">No completions yet</span>'}</div>${mode==='request'?requestPanel():''}</section><aside class="card"><div class="bar"><button id="back" ${history.length?'':'disabled'}>← Back</button><button id="next" class="primary" ${['request','end'].includes(s.phase)?'disabled':''}>${s.phase==='decision'?(s.outcome==='safe'?'Keep the grant':'Undo the grant'):'Next step →'}</button><button id="restart">Restart activity</button></div><div class="status ${s.outcome||''}" aria-live="polite">${s.message}</div>${comparison()}<p class="small muted">Gold row = selected · Green row = simulated completion. Use Back to restore the previous step.</p><h3>Before revealing the next step</h3><p>${s.phase==='request'?'Will this request leave a safe completion order? Check both the claim and availability first.':s.phase==='decision'?'Should the tentative grant be kept or undone? What calculation supports your answer?':s.phase==='release'?'How many resources will return? What will the new free count be?':'Which unfinished process can reach its maximum with the current free resources?'}</p><label class="small"><input type="checkbox" id="hideNeed" ${hideNeed?'checked':''}> Hide Need values for mental calculation</label><details><summary>What the algorithm is checking</summary><ol><li>New request must fit remaining Need and Available.</li><li>Try granting it in a temporary copy.</li><li>Find a process whose entire remaining Need fits Work.</li><li>Simulate completion and release all its resources.</li><li>Repeat. A full completion sequence proves safety.</li><li>Keep a safe grant. Undo an unsafe grant and defer the request.</li></ol><p>Safety checking uses maximum remaining needs. Deadlock detection uses current outstanding requests. Unsafe does not necessarily mean already deadlocked.</p><p>Completions here are hypothetical. A safety test does not run or terminate real processes. Assume each process can finish once its maximum resource demand is met.</p></details><details><summary>Step history</summary><ol class="log">${s.log.map(t=>`<li>${t}</li>`).join('')}</ol></details></aside></div>`;$('#back').onclick=()=>{s=history.pop();render()};$('#next').onclick=next;$('#restart').onclick=reset;document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>choose(+b.dataset.check));$('#hideNeed').onchange=e=>{hideNeed=e.target.checked;applyHide()};if(mode==='request'){const b=$('#test');if(b)b.onclick=()=>testRequest(+$('#who').value,ex.labels.map((_,j)=>Number($('#q'+j).value)));document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=ex.presets[+b.dataset.preset];$('#who').value=p.i;p.q.forEach((v,j)=>$('#q'+j).value=v)})}applyHide()}
let hideNeed=false;function applyHide(){document.querySelectorAll('tbody tr').forEach((row,i)=>{if(!s.done[i])row.children[3].textContent=hideNeed?'?':vec(need(i))})}
function requestPanel(){const allowed=['request','end'].includes(s.phase);return `<div class="request"><h3>New request</h3><p class="small muted">Presets fill the inputs without revealing the outcome. Each reset returns to the same starting allocation.</p><div class="bar">${ex.presets.map((p,i)=>`<button data-preset="${i}" ${allowed?'':'disabled'}>${p.name}</button>`).join('')}</div><div class="bar"><label>Process <select id="who" ${allowed?'':'disabled'}>${ex.names.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select></label>${ex.labels.map((l,j)=>`<label>${l} <input id="q${j}" aria-label="Request amount for ${l}" type="number" min="0" max="${ex.total[j]}" step="1" value="${j===0?1:0}" ${allowed?'':'disabled'}></label>`).join('')}<button id="test" class="primary" ${allowed?'':'disabled'}>Try granting request</button></div><div id="toast" role="status"></div></div>`}
function comparison(){if(!s.request)return '';const {i,q}=s.request;return `<h3>Request under review</h3><p>${ex.names[i]} requests <strong>${vec(q)}</strong>.</p><div class="small">${s.trial?`<p>Before tentative grant: Has ${vec(sub(s.trial[i],q))}; Need ${vec(sub(ex.max[i],sub(s.trial[i],q)))}; Available ${vec(add(available(s.trial),q))}.</p><p>After tentative grant: Has ${vec(s.trial[i])}; Need ${vec(sub(ex.max[i],s.trial[i]))}; Available ${vec(available(s.trial))}.</p>`:''}</div>`}
$('#scenario').onchange=e=>{key=e.target.value;reset()};$('#reset').onclick=reset;$('#safetyTab').onclick=()=>setMode('safety');$('#requestTab').onclick=()=>setMode('request');function setMode(m){mode=m;$('#safetyTab').classList.toggle('active',m==='safety');$('#requestTab').classList.toggle('active',m==='request');reset()}reset();
</script></body></html>
