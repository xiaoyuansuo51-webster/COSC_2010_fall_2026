<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadlock Detection Lab</title><style>
:root{--blue:#2359b6;--ink:#192d49;--muted:#526782;--bg:#f2f6fc;--red:#b82442;--green:#107451}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}header{background:#132d54;color:white;padding:28px max(24px,calc((100vw - 1180px)/2))}header p{color:#c9d9ef;margin:5px 0}h1{margin:4px 0;font-size:34px}main{max-width:1230px;margin:auto;padding:24px}nav,.controls{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}button,select{font:inherit;padding:10px 16px;border:1px solid #becce0;border-radius:9px;background:white;color:var(--ink);cursor:pointer}button:hover{background:#e9f0ff}button:focus-visible,select:focus-visible{outline:3px solid #e39816;outline-offset:3px}button.active,.primary{background:var(--blue);color:white}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px}.card{background:white;padding:22px;border:1px solid #dce5f2;border-radius:16px;box-shadow:0 5px 18px #17345a06}h2{font-size:25px;margin:0 0 8px}h3{margin:18px 0 8px;font-size:18px}.sub{color:var(--muted);margin:0 0 18px}.status{padding:16px;background:#eaf1ff;border-left:4px solid var(--blue);border-radius:5px;min-height:108px}.path{font:700 19px/1.7 ui-monospace,monospace;overflow-wrap:anywhere;padding:12px;background:#f1f5fb;border-radius:8px;min-height:54px}.legend{font-size:14px;color:var(--muted)}svg{width:100%;height:auto;display:block}.node{fill:#f0f5ff;stroke:#52719b;stroke-width:2}.node.current{fill:#ffe6ac;stroke:#a56800;stroke-width:4}.node.cycle{fill:#ffe1e8;stroke:var(--red);stroke-width:4}.edge{stroke:#a3b2c7;stroke-width:2.5;fill:none}.edge.on{stroke:#b87900;stroke-width:4}.edge.cycle{stroke:var(--red);stroke-width:4}svg text{font:600 19px system-ui;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}.pill{display:inline-block;border-radius:20px;background:#eaf1ff;padding:5px 12px;margin:3px;font-size:15px}.token{display:inline-grid;place-items:center;width:28px;height:28px;margin:3px;border-radius:50%;background:#2359b6;color:white;font-size:12px;animation:arrive .35s ease-out}.token.scanner{background:#8254b4}.pool{min-height:55px;background:#eef4fc;padding:10px;border-radius:9px}.process{border:2px solid #dce5f2;border-radius:10px;padding:14px;margin:12px 0;transition:background .3s,border-color .3s}.process.selected{border-color:#b87900;background:#fff9e9}.process.done{border-color:var(--green);background:#effaf5}.process button{margin-top:8px}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}th,td{padding:9px 7px;text-align:left;border-bottom:1px solid #dae3ef}tr.selected{background:#fff1cd}tr.done{color:var(--green)}details{margin-top:18px}summary{cursor:pointer;font-weight:600}footer{margin:24px 0;color:var(--muted);font-size:14px}.callout{border-left:4px solid #d3911d;background:#fff8e7;padding:12px;margin-top:16px}ol{padding-left:23px}li{margin-bottom:9px}.small{font-size:14px}.challenge{max-width:850px;margin:auto} @keyframes arrive{from{transform:translateY(-10px);opacity:.3}to{transform:none;opacity:1}}@media(max-width:850px){.grid{grid-template-columns:1fr}main{padding:14px}header{padding:22px}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><p>OPERATING SYSTEMS · INTERACTIVE LAB</p><h1>Deadlock Detection</h1><p>Dr. Xiaoyuan Suo, Webster University</p></header><main><nav aria-label="Activities"><button data-tab="graph" class="active">1. Find a cycle</button><button data-tab="tokens">2. Can anyone finish?</button><button data-tab="challenge">3. Cycle challenge</button></nav><div id="app"></div><footer>Self-contained classroom activity · No installation or internet connection required.</footer></main><script>
const $=s=>document.querySelector(s);let tab='graph',timer=null,gIndex=0,gFrames=[],gData=null,tState=null,tHistory=[],challengeTwo=true,cStep=0;
const graphs={simple:{nodes:{A:[140,140],R:[390,140],B:[390,360],S:[140,360]},edges:[['A','R'],['R','B'],['B','S'],['S','A']],start:'A'},full:{nodes:{A:[70,70],R:[240,70],S:[420,70],C:[600,70],F:[600,220],W:[600,370],D:[70,250],T:[240,250],E:[420,250],U:[70,440],G:[240,440],V:[420,440],B:[240,160]},edges:[['R','A'],['A','S'],['B','T'],['C','S'],['U','D'],['D','S'],['D','T'],['T','E'],['E','V'],['W','F'],['F','S'],['V','G'],['G','U']],start:'A'},clear:{nodes:{A:[100,130],R:[320,130],B:[530,130],S:[530,350]},edges:[['R','A'],['B','R'],['B','S']],start:'B'}};
function stop(){clearInterval(timer);timer=null;const b=$('#play');if(b)b.textContent='Auto play'}
function initGraph(key='simple'){stop();gData=graphs[key];gIndex=0;gFrames=[];const seen=new Set(),path=[],used=[];let found=false;function push(msg,cycle=[]){gFrames.push({path:[...path],used:used.map(e=>e.join('>')),msg,cycle})}push('Predict first: can you find a closed waiting chain? Select Next to begin the search.');function visit(n){seen.add(n);path.push(n);push('Visit '+n+'. Add it to the current search path.');for(const edge of gData.edges.filter(e=>e[0]===n)){const v=edge[1];used.push(edge);push('Follow '+n+' → '+v+'.');if(path.includes(v)){const cyc=path.slice(path.indexOf(v)).concat(v);path.push(v);push('Cycle found: '+cyc.join(' → ')+'. With one instance of every resource type, this cycle establishes deadlock.',cyc);found=true;return}if(!seen.has(v)){visit(v);if(found)return}else push(v+' was explored earlier, but is not on this path. That alone does not establish a cycle.')}path.pop();push('No unexplored outgoing arrows from '+n+'. Backtrack: remove '+n+' from the current path.')}for(const n of [gData.start,...Object.keys(gData.nodes)]){if(!seen.has(n)){visit(n);if(found)break}}if(!found)push('All nodes and arrows have been checked. No cycle exists; this snapshot has no resource deadlock.');renderGraph()}
function drawGraph(){const f=gFrames[gIndex],edges=gData.edges.map(([a,b])=>{const p=gData.nodes[a],q=gData.nodes[b],dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy),off=30,x=p[0]+dx/len*off,y=p[1]+dy/len*off,x2=q[0]-dx/len*off,y2=q[1]-dy/len*off;const cyc=f.cycle.some((v,i)=>v===a&&f.cycle[i+1]===b);return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" class="edge ${cyc?'cycle':f.used.includes(a+'>'+b)?'on':''}" marker-end="url(#arrow)"/>`}).join('');return `<svg viewBox="0 0 680 510" role="img" aria-label="Resource allocation graph. ${f.msg}"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>${edges}${Object.entries(gData.nodes).map(([n,[x,y]])=>{const cl='node '+(f.cycle.includes(n)?'cycle':f.path.at(-1)===n?'current':'');return (/[A-G]/.test(n)?`<circle cx="${x}" cy="${y}" r="26" class="${cl}"/>`:`<rect x="${x-25}" y="${y-25}" width="50" height="50" rx="3" class="${cl}"/>`)+`<text x="${x}" y="${y}">${n}</text>`}).join('')}</svg>`}
function controls(prefix,index,last){return `<div class="controls"><button id="back" ${index===0?'disabled':''}>← Back</button><button id="next" class="primary" ${index===last?'disabled':''}>Next step →</button><button id="reset">Reset</button>${prefix==='g'?'<button id="play">'+(timer?'Pause':'Auto play')+'</button>':''}</div>`}
function renderGraph(){const f=gFrames[gIndex],key=Object.keys(graphs).find(k=>graphs[k]===gData);$('#app').innerHTML=`<h2>Follow the waiting chain</h2><p class="sub">One instance of each resource type. Detect a cycle by revisiting a node on the current path.</p><div class="controls"><label>Example <select id="graphSelect"><option value="simple">Warm-up: two processes</option><option value="full">Slide example: processes A–G</option><option value="clear">No-cycle example</option></select></label></div><div class="grid"><section class="card"><div class="legend">Circle = process · Square = resource<br>Process → resource: requests · Resource → process: holds</div>${drawGraph()}</section><aside class="card">${controls('g',gIndex,gFrames.length-1)}<p class="small">Step ${gIndex} of ${gFrames.length-1}</p><div class="status" aria-live="polite">${f.msg}</div><h3>Current search path</h3><div class="path">${f.path.join(' → ')||'Empty'}</div><p class="legend">Gold = explored arrow / current node · Red = detected cycle</p><details><summary>How the detector works</summary><ol><li>Visit a node and add it to the current path.</li><li>Follow an unexplored outgoing arrow.</li><li>A repeated node on this path closes a cycle.</li><li>At a dead end, backtrack and try another arrow.</li><li>If needed, restart from an unvisited node.</li></ol><p>Only the repeated section of the path is the cycle. A process outside that cycle may also be blocked by it.</p></details></aside></div>`;$('#graphSelect').value=key;$('#graphSelect').onchange=e=>initGraph(e.target.value);$('#next').onclick=()=>{gIndex++;renderGraph()};$('#back').onclick=()=>{stop();gIndex--;renderGraph()};$('#reset').onclick=()=>initGraph(key);$('#play').onclick=()=>{if(timer){stop();return}if(gIndex===gFrames.length-1)gIndex=0;timer=setInterval(()=>{if(gIndex<gFrames.length-1){gIndex++;renderGraph()}else stop()},1700);renderGraph()}}
const scenarios={finish:{labels:['Tokens'],available:[1],holds:[[1],[2],[2]],requests:[[1],[1],[2]]},dead:{labels:['Tokens'],available:[0],holds:[[2],[2],[2]],requests:[[1],[1],[1]]},mixed:{labels:['Printers','Scanners'],available:[0,1],holds:[[1,0],[0,1],[1,0]],requests:[[0,1],[1,0],[0,1]]},partial:{labels:['Printers','Scanners'],available:[0,0],holds:[[1,0],[0,1],[1,0]],requests:[[0,1],[2,0],[0,0]]}};
function initTokens(key='finish'){stop();tHistory=[];const s=structuredClone(scenarios[key]);tState={...s,key,done:[false,false,false],phase:'choose',chosen:-1,msg:'Predict: whose CURRENT request can be met by the available pool? Click a process, or use Next step to let the detector scan.'};renderTokens()}
function save(){tHistory.push(structuredClone(tState))}function eligible(i){return tState.requests[i].every((v,j)=>v<=tState.available[j])}function pick(i){save();if(!eligible(i)){tState.msg='P'+(i+1)+' must wait. Its request '+fmt(tState.requests[i])+' exceeds the available pool '+fmt(tState.available)+' in at least one resource type.';renderTokens();return}tState.chosen=i;tState.phase='grant';tState.msg='P'+(i+1)+' can proceed: every requested count is at most the corresponding available count. Next, simulate granting its request.';renderTokens()}
function fmt(a){return '['+a.join(', ')+']'}function tokens(a){return a.map((v,j)=>`${tState.labels[j]}: ${v} ${Array.from({length:v},()=>`<span class="token ${j?'scanner':''}" aria-hidden="true">${j?'S':'●'}</span>`).join('')}`).join('<br>')}
function tNext(){if(tState.phase==='choose'){const i=tState.done.findIndex((d,i)=>!d&&eligible(i));if(i>=0){pick(i);return}save();tState.phase='end';const remaining=tState.done.flatMap((d,i)=>d?[]:['P'+(i+1)]);tState.msg=remaining.length?'A full scan found no process whose request can be met. Remaining resource-holding processes '+remaining.join(', ')+' are deadlocked in this model.':'Every process can finish. No deadlock is detected in this snapshot.'}else if(tState.phase==='grant'){save();const i=tState.chosen;tState.requests[i].forEach((v,j)=>{tState.available[j]-=v;tState.holds[i][j]+=v});tState.phase='release';tState.msg='Request granted in the simulation. P'+(i+1)+' now has what it needs to complete. Next, finish it and return ALL its held resources.'}else if(tState.phase==='release'){save();const i=tState.chosen;tState.holds[i].forEach((v,j)=>{tState.available[j]+=v;tState.holds[i][j]=0;tState.requests[i][j]=0});tState.done[i]=true;tState.chosen=-1;tState.phase='choose';tState.msg='P'+(i+1)+' completed in the simulation and released its resources. Scan the remaining processes again.'}renderTokens()}
function renderTokens(){$('#app').innerHTML=`<h2>Can anyone finish?</h2><p class="sub">Simulate completion, release resources, then scan again. All requests shown are current outstanding requests.</p><div class="controls"><label>Scenario <select id="scenario"><option value="finish">Six tokens: everyone can finish</option><option value="dead">Six tokens: deadlock</option><option value="mixed">Two resource types: completion</option><option value="partial">Some finish; others remain deadlocked</option></select></label></div><div class="grid"><section class="card"><h3>Available pool A (working copy)</h3><div class="pool">${tokens(tState.available)}</div>${tState.holds.map((a,i)=>`<div class="process ${tState.done[i]?'done':tState.chosen===i?'selected':''}"><div class="row"><strong>P${i+1}</strong><span>${tState.done[i]?'✓ Simulated completion':tState.chosen===i?'Selected':'Unfinished'}</span></div><div>Currently holds: ${tokens(a)}</div><p>Current request: <strong>${fmt(tState.requests[i])}</strong></p><button data-pick="${i}" ${tState.done[i]||tState.phase!=='choose'?'disabled':''}>Check P${i+1}</button></div>`).join('')}</section><aside class="card">${controls('t',tHistory.length,tState.phase==='end'?tHistory.length:-1)}<div class="status" aria-live="polite">${tState.msg}</div><h3>Match the slide notation</h3><p class="small">Vector order: ${tState.labels.join(', ')}<br>C = resources currently held<br>R = current outstanding requests<br>A = available resources</p><table><thead><tr><th>Process</th><th>C</th><th>R</th></tr></thead><tbody>${tState.holds.map((a,i)=>`<tr class="${tState.done[i]?'done':tState.chosen===i?'selected':''}"><td>P${i+1}</td><td>${fmt(a)}</td><td>${fmt(tState.requests[i])}</td></tr>`).join('')}</tbody></table><div class="callout">This is a reasoning simulation. Detection itself does not execute or terminate the real processes.</div><details><summary>Algorithm and assumptions</summary><p>Find an unfinished process with R ≤ A, comparing every resource type. Simulate its completion and return its allocation to the pool. Repeat until all finish or no progress is possible.</p><p>The grant-and-release animation has the same net effect as the slide update A = A + C using the process’s original allocation. Assume a satisfied process can finish and release its resources.</p><p>Banker’s safety test uses maximum remaining needs. This detection activity uses current requests.</p></details></aside></div>`;$('#scenario').value=tState.key;$('#scenario').onchange=e=>initTokens(e.target.value);$('#next').onclick=tNext;$('#back').onclick=()=>{tState=tHistory.pop();renderTokens()};$('#reset').onclick=()=>initTokens(tState.key);document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(+b.dataset.pick))}
function renderChallenge(){const stages=challengeTwo?['P1 holds the scanner. P2 holds printer 1. P1 requests a printer; P2 requests the scanner. A cycle is present. Predict: can either process proceed?','The spare printer 2 is available. Grant it to P1. P2 continues waiting for the scanner.','P1 finishes and releases the scanner and printer 2. P2 can now obtain the scanner.','P2 finishes and releases its resources. A cycle existed, but the spare instance allowed progress.']:['There is only one printer. P1 holds the scanner and requests that printer. P2 holds the printer and requests the scanner. Predict what happens.','No spare printer exists. P1 cannot proceed. P2 cannot obtain the scanner. The two processes are deadlocked.'];$('#app').innerHTML=`<div class="challenge"><h2>A cycle exists. Is there deadlock?</h2><p class="sub">Change the number of printers while keeping the same waiting cycle.</p><div class="controls"><button id="one" class="${!challengeTwo?'active':''}">1 printer</button><button id="two" class="${challengeTwo?'active':''}">2 printers</button></div><section class="card"><div class="row"><div class="process"><strong>P1</strong><p>Holds: scanner<br>Requests: one printer</p></div><div class="process"><strong>P2</strong><p>Holds: printer 1<br>Requests: scanner</p></div></div><div class="path">P1 → Printer → P2 → Scanner → P1</div><p class="legend">The graph contains a cycle in both cases. Printer instances matter.</p><div class="pool">${challengeTwo?(cStep===0?'Printer 2: AVAILABLE':cStep===1?'Printer 2: allocated to P1':cStep===2?'Scanner and printer 2: released by P1':'All resources: released'):'No spare printer'}</div><br>${controls('c',cStep,stages.length-1)}<div class="status" aria-live="polite">${stages[cStep]}</div><div class="callout"><strong>Detection rule:</strong> One instance per resource type: a cycle establishes deadlock. Multiple instances: a cycle alone is insufficient; check available instances and possible completions.</div></section></div>`;$('#one').onclick=()=>{challengeTwo=false;cStep=0;renderChallenge()};$('#two').onclick=()=>{challengeTwo=true;cStep=0;renderChallenge()};$('#next').onclick=()=>{cStep++;renderChallenge()};$('#back').onclick=()=>{cStep--;renderChallenge()};$('#reset').onclick=()=>{cStep=0;renderChallenge()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stop();tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(tab==='graph')initGraph();else if(tab==='tokens')initTokens();else{cStep=0;renderChallenge()}});initGraph();
</script></html>
